version: 2

models:
  - name: fct_trips
    description: >
      Fact table containing detailed trip-level data for Citibike analytics.
      Built from the staging model stg_citibike_trips, it provides enriched
      temporal fields and user demographics for time-based and behavioral analysis.

    columns:
      - name: trip_id
        description: "Unique surrogate key generated for each trip."
        tests:
          - not_null
          - unique

      - name: starttime
        description: "Timestamp when the trip started."
        tests:
          - not_null

      - name: stoptime
        description: "Timestamp when the trip ended."

      - name: duration_seconds
        description: "Trip duration in seconds (calculated if not provided)."

      - name: start_station_id
        description: "Identifier for the station where the trip began."
        tests:
          - not_null
          - relationships:
              to: ref('dim_stations')
              field: station_id

      - name: end_station_id
        description: "Identifier for the station where the trip ended."
        tests:
          - relationships:
              to: ref('dim_stations')
              field: station_id

      - name: bikeid
        description: "Unique identifier of the bike used for the trip."

      - name: usertype
        description: "Type of user: Subscriber or Customer."

      - name: birth_year
        description: "User’s year of birth (as recorded in the source data)."

      - name: gender
        description: "User’s gender code (numeric or categorical)."

      - name: age
        description: "Derived user age based on the current year and birth year."

      - name: hour_of_day
        description: "Hour (0–23) when the trip started."

      - name: day_of_week
        description: "Day of the week when the trip started (1=Sunday)."

      - name: is_weekend
        description: "Boolean flag indicating if the trip started on a weekend."

      - name: load_id
        description: "Unique identifier for the data load batch."

      - name: loaded_at
        description: "Timestamp when the record was loaded into the system."
