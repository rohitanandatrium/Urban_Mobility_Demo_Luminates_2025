version: 2

models:
  - name: dim_stations
    description: "Dimension table containing unique bike station information derived from both start and end stations in trip data."
    columns:
      - name: station_id
        description: "Unique identifier for the bike station"
        tests:
          - not_null
          - unique
      - name: station_name
        description: "Name of the bike station"
        tests:
          - not_null
      - name: latitude
        description: "Geographic latitude coordinate of the station"
      - name: longitude
        description: "Geographic longitude coordinate of the station"

  - name: fct_trips
    description: "Fact table containing detailed trip information with temporal enrichments for analytical reporting."
    columns:
      - name: trip_id
        description: "Surrogate key uniquely identifying each trip"
        tests:
          - not_null
          - unique
      - name: bikeid
        description: "Identifier for the bike used in the trip"
      - name: starttime
        description: "Timestamp when the trip started"
        tests:
          - not_null
      - name: stoptime
        description: "Timestamp when the trip ended"
      - name: tripduration
        description: "Duration of the trip in seconds"
      - name: start_hour
        description: "Hour of the day when the trip started (0-23)"
      - name: start_day
        description: "Day of the month when the trip started"
      - name: start_month
        description: "Month when the trip started"
      - name: start_year
        description: "Year when the trip started"
      - name: day_of_week
        description: "Name of the day of week when trip started"
      - name: weekend_indicator
        description: "Indicates whether the trip started on a weekend or weekday"
      - name: start_station_id
        description: "Foreign key referencing the starting station in dim_stations"
      - name: end_station_id
        description: "Foreign key referencing the ending station in dim_stations"
      - name: usertype
        description: "Type of user (Subscriber, Customer, etc.)"
      - name: birth_year
        description: "Birth year of the user"
      - name: age
        description: "Calculated age of the user based on birth year"
      - name: gender
        description: "Gender of the user"
      - name: start_latitude
        description: "Starting latitude coordinate"
      - name: start_longitude
        description: "Starting longitude coordinate"
      - name: end_latitude
        description: "Ending latitude coordinate"
      - name: end_longitude
        description: "Ending longitude coordinate"